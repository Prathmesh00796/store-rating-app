services:
  # ----------------------------------------------------
  # Backend Express REST API (Free Web Service)
  # ----------------------------------------------------
  - type: web
    name: store-rating-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: store_rating
      - key: DB_SSL
        value: "true"

  # ----------------------------------------------------
  # Frontend React Vite SPA (Free Static Site)
  # ----------------------------------------------------
  - type: web
    name: store-rating-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
